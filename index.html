<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine's Proposal</title>
  <!-- Load canvas-confetti -->
  <script src="https://cdn.skypack.dev/canvas-confetti"></script>
  <!-- Load YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: pink;
      font-family: Arial, sans-serif;
      text-align: center;
      transition: background-color 0.5s;
      margin: 0;
    }
    #proposal, #celebration {
      width: 100%;
    }
    /* Initially show the proposal, hide the celebration */
    #celebration {
      display: none;
    }
    h1 {
      color: red;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .buttons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      justify-content: center;
    }
    button {
      font-size: 20px;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      border-radius: 10px;
    }
    #yes {
      background-color: red;
      color: white;
    }
    #no {
      background-color: white;
      color: red;
    }
    iframe {
      border: none;
    }
    /* Hidden player container styling */
    #player {
      width: 1px;
      height: 1px;
      opacity: 0;
      position: absolute;
      left: -10000px;
      top: 0;
    }
  </style>
</head>
<body>
  <!-- Proposal Section -->
  <div id="proposal">
    <h1 id="question">
      <span style="font-size: 30px;">❤️</span> Will you be my Valentine? <span style="font-size: 30px;">❤️</span>
    </h1>
    <p id="pressNo">Press the no button for fun (let my code do its thing)</p>
    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </div>

  <!-- Celebration Section (hidden initially) -->
  <div id="celebration">
    <h1 style="color: red; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <span style="font-size: 30px;">❤️</span> I love you! My forever Valentine <span style="font-size: 30px;">❤️</span>
    </h1>
    <div style="margin-top: 20px;">
      <!-- Embedded Tenor GIF -->
      <iframe src="https://tenor.com/embed/15411651" style="width: 100%; max-width: 500px; height: 281px;" allow="autoplay"></iframe>
      <p style="font-size: 20px; color: red; margin-top: 10px;">(us)</p>
    </div>
  </div>

  <!-- Hidden YouTube Player Container -->
  <div id="player"></div>

  <script>
    let noTexts = ["Are you sure?", "Come on puppy please", "No (yes)", "Delina sobs"];
    let noClickCount = 0;

    function shrinkAndGrow() {
      const noButton = document.getElementById('no');
      const yesButton = document.getElementById('yes');

      // Shrink the "No" button
      let currentNoSize = parseFloat(window.getComputedStyle(noButton).fontSize);
      let newNoSize = currentNoSize * 0.8;
      noButton.style.fontSize = `${newNoSize}px`;
      noButton.style.padding = `${newNoSize / 2}px`;

      // Grow the "Yes" button
      let currentYesSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
      let newYesSize = currentYesSize * 1.2;
      yesButton.style.fontSize = `${newYesSize}px`;
      yesButton.style.padding = `${newYesSize / 2}px`;

      // Update the "No" button text
      noButton.textContent = noTexts[noClickCount % noTexts.length];
      noClickCount++;
    }

    function celebrate() {
      // Change background to white
      document.body.style.backgroundColor = "white";
      // Hide proposal, show celebration
      document.getElementById("proposal").style.display = "none";
      document.getElementById("celebration").style.display = "block";
      startConfetti();
      // Play the YouTube video (audio only)
      if (player && typeof player.playVideo === 'function') {
          player.playVideo();
      }
    }

    function startConfetti() {
      confetti({
        particleCount: 200,
        spread: 100,
        origin: { y: 0.6 }
      });
    }

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("yes").addEventListener("click", celebrate);
      document.getElementById("no").addEventListener("click", shrinkAndGrow);
    });

    // YouTube IFrame API integration
    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '1',
        width: '1',
        videoId: 'AE005nZeF-A',
        playerVars: {
          'autoplay': 0,  // We'll trigger autoplay manually on click
          'controls': 0,
          'mute': 0       // Ensure the video is not muted if you want audio
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      // The player is ready; playback will be triggered when "Yes" is clicked.
      // You can also unmute or set volume here if needed.
      // event.target.unMute();
    }
  </script>
</body>
</html>
